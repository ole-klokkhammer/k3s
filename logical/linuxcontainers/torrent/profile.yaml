name: torrent
description: Torrent Server container profile
config:
  user.host: "core"
  limits.cpu: "2"
  limits.memory: 8GB
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: "00:16:3e:e7:58:62"
  root:
    path: /
    pool: zpool
    type: disk
  torrent-data:
    source: /dev/zvol/ssd/vm/torrent-zvol
    type: disk
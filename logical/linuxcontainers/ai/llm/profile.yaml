name: llm
description: A profile for running LLMs on a GPU worker with local models.
config:
  user.host: core
  limits.memory: 128GB
  limits.memory.swap: "false"
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
  security.nesting: "true"
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:f8:e0:fb
  gpu:
    type: gpu
    gputype: physical
    id: nvidia.com/gpu=1
  root:
    path: /
    pool: zpool
    type: disk
  models:
    path: /models
    shift: "true"
    source: /ssd/llm/models
    type: disk
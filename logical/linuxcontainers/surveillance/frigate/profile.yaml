name: frigate
description: Frigate container profile
config:
  user.host: core
  limits.cpu: "4"
  limits.memory: 16GB
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
  security.nesting: "true"
devices:
  gpu:
    type: gpu
    gputype: physical
    id: nvidia.com/gpu=0
  config:
    path: /config
    shift: "true"
    source: /ssd/appdata/frigate
    type: disk
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  media:
    path: /media/frigate
    shift: "true"
    source: /hdd/surveillance/frigate
    type: disk
  root:
    path: /
    pool: zpool
    type: disk
used_by: []
project: default
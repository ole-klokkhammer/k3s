name: mediamtx
description: Mediamtx LXC - camera ingest, recording, playback API (CPU-only, unprivileged)
config:
  user.host: core
  limits.cpu: "2"
  limits.memory: 4GB
  secutity.nesting: "true"
  raw.lxc: |
    lxc.apparmor.profile = unconfined
    lxc.cap.drop =
devices:
  config:
    path: /config
    shift: "true"
    source: /ssd/appdata/mediamtx
    type: disk
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
  media:
    path: /media
    shift: "true"
    source: /hdd/surveillance/mediamtx
    type: disk
  env:
    path: /env
    shift: "true"
    source: /ssd/appdata/env
    type: disk
  root:
    path: /
    pool: zpool
    type: disk
used_by: []
project: default

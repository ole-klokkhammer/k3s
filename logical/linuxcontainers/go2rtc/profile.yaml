name: go2rtc
description: go2rtc profile
config:
  user.host: "core"
  limits.cpu: "2"
  limits.memory: 4GB
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br0
    type: nic
    hwaddr: 00:16:3e:22:cb:3d 
  gpu:
    type: gpu
    gputype: physical
    id: nvidia.com/gpu=0
  root:
    path: /
    pool: zpool
    type: disk
  config:
    path: /config
    shift: "true"
    source: /ssd/appdata/go2rtc
    type: disk
project: default
